name: Temp SkyUI SDK Transfer
permissions:
  contents: write
on:
  push:
    branches:
      - tmp/skyui-sdk-transfer-20260923
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: 624a6a49265fd7a6fc63bda1611013ceabeacb8a
          path: sdk
          submodules: recursive
      - name: Package
        run: tar -cJf plugin-sdk-2025-10-25.tar.xz sdk
      - name: Publish temp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete temp-skyui-sdk-20260923 --repo ${{ github.repository }} --yes || true
          gh release create temp-skyui-sdk-20260923 plugin-sdk-2025-10-25.tar.xz --repo ${{ github.repository }} --title "Temporary SkyUI SDK transfer" --notes "Temporary source transfer for local build"
