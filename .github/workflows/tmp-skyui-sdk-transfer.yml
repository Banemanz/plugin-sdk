name: Temp SkyUI SDK Transfer
permissions:
  contents: write
on:
  push:
    branches:
      - tmp/skyui-sdk-transfer-20260923
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact SDK snapshot
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: 624a6a49265fd7a6fc63bda1611013ceabeacb8a
          path: sdk
          submodules: recursive
      - name: Package
        run: tar -cJf plugin-sdk-2025-10-25.tar.xz sdk
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-sdk-2025-10-25-source
          path: plugin-sdk-2025-10-25.tar.xz
